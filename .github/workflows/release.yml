name: Release

on:
  push:
    tags:
      - "gepa-core-v*"
      - "plugin-std-v*"
      - "plugin-registry-v*"
      - "memory-provider-v*"
      - "astramem-client-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Resolve package directory from tag
        id: pkg
        run: |
          case "${GITHUB_REF_NAME}" in
            gepa-core-v*) echo "dir=packages/gepa-core" >> "$GITHUB_OUTPUT" ;;
            plugin-std-v*) echo "dir=packages/plugin-std" >> "$GITHUB_OUTPUT" ;;
            plugin-registry-v*) echo "dir=packages/plugin-registry" >> "$GITHUB_OUTPUT" ;;
            memory-provider-v*) echo "dir=packages/memory-provider" >> "$GITHUB_OUTPUT" ;;
            astramem-client-v*) echo "dir=packages/astramem-client" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unrecognized tag prefix: ${GITHUB_REF_NAME}" >&2; exit 1 ;;
          esac

      # npm publish does NOT rewrite the workspace: protocol (unlike bun/pnpm publish).
      # A package.json carrying "workspace:*" would ship broken to the registry.
      - name: Guard against unresolved workspace deps
        run: |
          if grep -q '"workspace:' "${{ steps.pkg.outputs.dir }}/package.json"; then
            echo "package.json contains workspace: protocol deps — npm publish would ship them verbatim." >&2
            echo "Pin the dependency to a published version before tagging." >&2
            exit 1
          fi

      - run: bun install --frozen-lockfile

      # Every workspace package's main/types point at dist/, so any package that
      # depends on a sibling (gepa-core -> plugin-std, memory-provider ->
      # astramem-client, etc.) needs that sibling's dist built before the
      # pre-publish test/typecheck gate or it fails module resolution. Building
      # the whole workspace — rather than hand-maintaining a list of "packages
      # that happen to be depended on today" — means a newly added sibling
      # dependency is covered automatically, with no line to remember to add.
      # `bun --filter '*' build` walks the workspace dependency graph and builds
      # dependencies before dependents (verified locally: leaf packages
      # plugin-std/astramem-client always build before gepa-core/plugin-registry/
      # memory-provider/astramem-openclaw, which import them); each package's
      # build is an independent `tsc -p tsconfig.build.json` emit, so packages
      # with no dependency relationship may run in either order safely.
      - run: bun --filter '*' build

      - run: bun run test
        working-directory: ${{ steps.pkg.outputs.dir }}
      - run: bun run typecheck
        working-directory: ${{ steps.pkg.outputs.dir }}
      # semver:check only exists on gepa-core today; the other packages have no
      # published baseline to diff against yet.
      - run: bun run semver:check
        working-directory: ${{ steps.pkg.outputs.dir }}
        if: steps.pkg.outputs.dir == 'packages/gepa-core'

      - run: npm publish --provenance --access public
        working-directory: ${{ steps.pkg.outputs.dir }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
